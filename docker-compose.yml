services:
  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    ports: ['9092:9092']
    environment:
      KAFKA_NODE_ID: '1'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://:9092,CONTROLLER://:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
  spark-master:
    image: apache/spark:3.5.5
    hostname: spark-master
    command: ['/opt/spark/bin/spark-class','org.apache.spark.deploy.master.Master','-h','spark-master']
    ports: ['8080:8080','7077:7077']
    volumes: ['.:/opt/project']
  spark-worker:
    image: apache/spark:3.5.5
    depends_on: [spark-master]
    command: ['/opt/spark/bin/spark-class','org.apache.spark.deploy.worker.Worker','spark://spark-master:7077']
    volumes: ['.:/opt/project']
  airflow:
    build: ./airflow
    hostname: airflow
    # Grupo do Spark (GID 185) para acesso compartilhado aos arquivos Parquet.
    # Mantemos o UID original do Airflow para não afetar sua inicialização.
    group_add: ['185']
    depends_on: [spark-master]
    ports: ['8081:8080']
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__DAGS_FOLDER: /opt/project/airflow/dags
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
    volumes: ['.:/opt/project']
    command: standalone
